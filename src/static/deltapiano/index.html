<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer type="module"></script>
    <title>deltapiano</title>
    <link rel="icon" href="assets/sprites/note.png">
</head>
<body>
    <div id="square_box"></div>
    <div id="piano_ui_container">
        <div id="piano_ui">
            <div id="neutral"></div>
            <div id="arrow_right"></div>
            <div id="arrow_down_right"></div>
            <div id="arrow_down"></div>
            <div id="arrow_down_left"></div>
            <div id="arrow_left"></div>
            <div id="arrow_up_left"></div>
            <div id="arrow_up"></div>
            <div id="shift"></div>
        </div>
    </div>
    <div id="instruments_container">
        <div id="instruments">
            <div data-instrument="piano"></div>
            <div data-instrument="rock_guitar"></div>
            <div data-instrument="choir"></div>
            <div data-instrument="music_box"></div>
            <div data-instrument="violin"></div>
            <div data-instrument="bass"></div>
            <div data-instrument="acoustic_guitar"></div>
            <div data-instrument="sine_whistle"></div>
            <div data-instrument="splat"></div>
            <div data-instrument="snare"></div>
            <div data-instrument="bass_drum"></div>
            <div data-instrument="hi_hat"></div>
            <div data-instrument="square_wave"></div>
            <div data-instrument="saw_wave"></div>
            <div data-instrument="noise_wave"></div>
            <div data-instrument="tamborine"></div>
            <div data-instrument="synthetic_meow"></div>
            <div data-instrument="bongo"></div>
            <div data-instrument="pulse_wave"></div>
            <div data-instrument="triangle_wave"></div>
            <div data-instrument="crash_cymbal"></div>
            <div data-instrument="fm_bass"></div>
            <div data-instrument="steel_drum"></div>
            <div data-instrument="organ"></div>
        </div>
    </div>
    <span id="loading_notice">loading Tone.js...</span>
</body>
</html>
